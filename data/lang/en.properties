tooltip.device.name=Enter a friendly name used to identify this device in WakeWizard. This field is mandatory.
tooltip.device.mac=MAC address of the network interface that will receive the Wake-on-LAN Magic Packet. When the device comes from network discovery, this value is pre-filled automatically.
tooltip.device.ip=Optional IP address of the target device. When configured, WakeWizard can use it to determine when the device becomes reachable and stop sending further Magic Packets.
tooltip.device.initialDelay=Time to wait after WakeWizard reconnects to Wi-Fi before sending the first Magic Packet.
tooltip.device.packetCount=Maximum number of Magic Packets WakeWizard will send during this wake sequence.
tooltip.device.packetInterval=Time between two consecutive Magic Packets.
tooltip.device.udpPort=UDP destination port used for the Wake-on-LAN Magic Packet. Port 9 is a common default.
tooltip.device.stopWhenReachable=When enabled and an IP address is configured, WakeWizard stops the wake sequence as soon as the target becomes reachable.
tooltip.device.wakeOnBoot=Automatically start the Wake-on-LAN sequence for this device after WakeWizard connects to Wi-Fi.
tooltip.device.enabled=When disabled, the device remains saved but is excluded from automatic or bulk wake operations.
tooltip.device.maxReachabilityChecks=Maximum number of reachability checks performed while waiting for the target device to become available.
tooltip.device.pingTimeout=Timeout used for each reachability check, expressed in milliseconds.
tooltip.device.broadcast=Optional broadcast address to use for the Magic Packet. Leave it empty to use the automatically derived broadcast address.
tooltip.device.secureOn=Optional SecureOn password supported by some Wake-on-LAN implementations. Leave it empty when not required.
tooltip.device.category=Optional category used to organize devices.
tooltip.device.notes=Optional free-form notes about this device.


