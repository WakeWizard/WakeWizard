tooltip.device.name=Inserisci un nome descrittivo per identificare il dispositivo in WakeWizard. Questo campo è obbligatorio.
tooltip.device.mac=Indirizzo MAC dell'interfaccia di rete che riceverà il Magic Packet Wake-on-LAN. Se il dispositivo proviene dalla scansione di rete, questo valore viene compilato automaticamente.
tooltip.device.ip=Indirizzo IP opzionale del dispositivo di destinazione. Se configurato, WakeWizard può usarlo per determinare quando il dispositivo diventa raggiungibile e interrompere l'invio di ulteriori Magic Packet.
tooltip.device.initialDelay=Tempo di attesa dopo che WakeWizard si è riconnesso al Wi-Fi prima di inviare il primo Magic Packet.
tooltip.device.packetCount=Numero massimo di Magic Packet che WakeWizard invierà durante questa sequenza di risveglio.
tooltip.device.packetInterval=Tempo tra due Magic Packet consecutivi.
tooltip.device.udpPort=Porta UDP di destinazione usata per il Magic Packet Wake-on-LAN. La porta 9 è un valore predefinito comune.
tooltip.device.stopWhenReachable=Se abilitato e se è configurato un indirizzo IP, WakeWizard interrompe la sequenza di risveglio non appena il dispositivo diventa raggiungibile.
tooltip.device.wakeOnBoot=Avvia automaticamente la sequenza Wake-on-LAN per questo dispositivo dopo che WakeWizard si connette al Wi-Fi.
tooltip.device.enabled=Se disabilitato, il dispositivo rimane salvato ma viene escluso dalle operazioni di risveglio automatiche o di gruppo.
tooltip.device.maxReachabilityChecks=Numero massimo di controlli di raggiungibilità eseguiti durante l'attesa che il dispositivo di destinazione diventi disponibile.
tooltip.device.pingTimeout=Timeout usato per ciascun controllo di raggiungibilità, espresso in millisecondi.
tooltip.device.broadcast=Indirizzo broadcast opzionale da usare per il Magic Packet. Lascia vuoto per usare l'indirizzo broadcast calcolato automaticamente.
tooltip.device.secureOn=Password SecureOn opzionale supportata da alcune implementazioni Wake-on-LAN. Lascia vuoto se non richiesta.
tooltip.device.category=Categoria opzionale usata per organizzare i dispositivi.
tooltip.device.notes=Note libere opzionali relative al dispositivo.


